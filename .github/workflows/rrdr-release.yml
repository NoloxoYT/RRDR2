name: Build tool release

# The `rrdr` CLI lives on the `build_tools` branch. Pushing a tag there publishes
# it; the repository is public so no Cargo token is needed.

on:
  push:
    tags:
      - "rrdr-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/build_tools' || startsWith(github.ref, 'refs/tags/rrdr-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked --all-targets

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo publish --locked
