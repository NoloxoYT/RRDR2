[workspace]
resolver = "2"
members = [
    "crates/realistic-damages",
    "crates/rrdr-bridge",
    "crates/rrdr-game",
    "crates/rrdr-natives",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://example.invalid/RealisticDamages"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = "symbols"
