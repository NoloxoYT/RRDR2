<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <g fill="#c2341c">
    <!-- gear teeth, every 30 degrees -->
    <rect x="14.3" y="0.4" width="3.4" height="3.9" rx="0.7"/>
    <rect x="14.3" y="0.4" width="3.4" height="3.9" rx="0.7" transform="rotate(30 16 16)"/>
    <rect x="14.3" y="0.4" width="3.4" height="3.9" rx="0.7" transform="rotate(60 16 16)"/>
    <rect x="14.3" y="0.4" width="3.4" height="3.9" rx="0.7" transform="rotate(90 16 16)"/>
    <rect x="14.3" y="0.4" width="3.4" height="3.9" rx="0.7" transform="rotate(120 16 16)"/>
    <rect x="14.3" y="0.4" width="3.4" height="3.9" rx="0.7" transform="rotate(150 16 16)"/>
    <rect x="14.3" y="0.4" width="3.4" height="3.9" rx="0.7" transform="rotate(180 16 16)"/>
    <rect x="14.3" y="0.4" width="3.4" height="3.9" rx="0.7" transform="rotate(210 16 16)"/>
    <rect x="14.3" y="0.4" width="3.4" height="3.9" rx="0.7" transform="rotate(240 16 16)"/>
    <rect x="14.3" y="0.4" width="3.4" height="3.9" rx="0.7" transform="rotate(270 16 16)"/>
    <rect x="14.3" y="0.4" width="3.4" height="3.9" rx="0.7" transform="rotate(300 16 16)"/>
    <rect x="14.3" y="0.4" width="3.4" height="3.9" rx="0.7" transform="rotate(330 16 16)"/>
    <circle cx="16" cy="16" r="12"/>
  </g>
  <text x="16" y="17" text-anchor="middle" dominant-baseline="middle"
        font-family="Georgia, serif" font-weight="bold" font-size="15"
        fill="#ffffff">R</text>
</svg>
