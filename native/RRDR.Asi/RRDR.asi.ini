# RRDR.asi configuration.
#
# The ASI loader scans <game>/scripts/Rscripts for *.dll and loads every file
# that exports rd_abi_version. No per-core editing is required: each core can
# read its own <CoreName>.ini from the same folder.

# Optional: load cores from another folder. Empty = scripts\Rscripts.
# Relative paths are resolved from the game folder.
mods_dir =

# Log file. A separate RRDR.asi.log is always written next to the cores.
log_file = RRDR.asi.log

# Watch <CoreName>.ini files and call rd_reload_config when they change.
reload_config = true

# Optional: skip specific cores, comma separated.
# disable = better_economy.dll
disable =
