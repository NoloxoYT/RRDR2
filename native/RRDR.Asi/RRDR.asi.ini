# RRDR.asi configuration.
#
# Every key lives under [RRDR]: the loader reads that section only. Keys
# outside a section are ignored, which is why an ini without the header
# looked like it had no effect.
#
# The loader scans <game>/scripts/Rscripts for *.dll and loads every file that
# exports rd_abi_version. No per-core editing is required: each core reads its
# own <CoreName>.ini from the same folder.

[RRDR]

# Optional: load cores from another folder. Empty = scripts\Rscripts.
# Relative paths are resolved from the game folder.
mods_dir =

# Watch <CoreName>.ini files and call rd_reload_config when they change.
reload_config = true

# Optional: comma-separated DLL file names to skip, e.g.
#   disable = BetterEconomyCore.dll,OldCore.dll
disable =
