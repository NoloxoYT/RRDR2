# RealisticDamages core configuration.
# Changes are hot-reloaded while the game is running (see RRDR.Host.ini).

# Master switch. On disable, damage multipliers are restored to 1.0.
enabled = true

[damage]
# Incoming damage multiplier for the local player.
# 1.0 = vanilla, 2.0 = twice the damage.
player_damage_multiplier = 1.35

# Global AI weapon damage multiplier.
ai_weapon_damage_multiplier = 1.15

# Kill on a head hit when the player is below headshot_threshold * max health.
headshot_lethal = false
headshot_threshold = 0.35

[bleeding]
# Start a bleed after arm / leg / torso hits.
bleed_enabled = true
bleed_damage_per_second = 2.5
bleed_duration_seconds = 20
# Hits below this amount do not start a bleed.
bleed_min_damage = 8
# If false, bleeding stops at 1 HP instead of killing the player.
bleed_can_kill = false

[debug]
debug = false
# Poll interval for player health / bone. Lower = more responsive, more native calls.
tick_interval_ms = 100
# Re-apply multipliers periodically in case the game resets them.
reapply_interval_seconds = 5
