# RRDR.Host configuration (ScriptHookRDR2DotNet loader).
#
# The host scans mods_dir and loads every DLL that exports rd_abi_version.
# Each core may read its own <CoreName>.ini from the same folder.

# Folder scanned for cores. Empty/absent = this folder.
mods_dir =

# Host log file, relative to this folder.
log_file = RRDR.Host.log

# Watch <CoreName>.ini files and call rd_reload_config on change.
reload_config = true

# Optional: skip specific cores, comma separated.
disable =
